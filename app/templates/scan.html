<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 건물 스캔 애니메이션 테스트</title>
    <style>
        /* 1. 건물이 들어갈 메인 이미지 박스 (시안의 우측 뷰어 부모 역할) */
        .scan-container {
            position: relative;
            width: 500px;
            height: 350px;
            background-color: #1e293b; /* 건물 사진이 없을 때를 대비한 다크 배경 */
            border: 2px solid #00ffcc; /* SF 감성의 네온 민트색 테두리 */
            border-radius: 8px;
            overflow: hidden; /* 레이저가 박스 바깥으로 나가지 않도록 차단 */
        }

        /* 샘플 건물 이미지 임시 배치 */
        .building-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7; /* 레이저가 잘 보이도록 이미지를 살짝 어둡게 처리 */
        }

        /* 2. 핵심: CSS 레이저 스캔 라인 */
        .laser-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 4px; /* 레이저 선의 두께 */
            
            /* 녹색 네온 그라데이션 중심부 설정 */
            background: linear-gradient(to right, transparent, #00ff66, transparent);
            
            /* 레이저가 번지는 듯한 하이테크 발광 효과 */
            box-shadow: 0 0 15px #00ff66, 0 0 30px #00ff66;
            
            /* 3. 애니메이션 연결: 'scan'이라는 명령을 2.5초 동안 무한 반복(infinite)하며 부드럽게(linear) 실행 */
            animation: scan 2.5s infinite linear;
        }

        /* 4. 애니메이션 움직임 정의 (위아래 왕복 연출) */
        @keyframes scan {
            0% {
                top: 0%; /* 시작점: 이미지 가장 위 */
            }
            50% {
                top: 100%; /* 중간점: 이미지 가장 아래 */
            }
            100% {
                top: 0%; /* 끝점: 다시 가장 위로 복귀 */
            }
        }
    </style>
</head>
<body>

    <!-- 화면에 구현될 HTML 구조 -->
    <div class="scan-container">
        <!-- 스캔 레이저 선 (이미지 위에 얹어둠) -->
        <div class="laser-line"></div>
        
        <!-- 분석할 건물 이미지 (테스트용 무료 이미지 링크) -->
        <img class="building-image" src="https://unsplash.com" alt="건물 외벽">
    </div>

</body>
</html>
